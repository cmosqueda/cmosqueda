name: Generate contribution grass

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution grass
        uses: nrysk/cgrass@v1.0.0
        with:
          github_username: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: output/output.png
          command: theme
          argument: github

      - name: Publish contribution grass
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
          commit_message: Generate contribution grass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
